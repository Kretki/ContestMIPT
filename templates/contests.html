{% extends 'base_with_user_profile.html' %}
{% block title %}Выбор контеста{% endblock %}
{% block content %}
<div class="contests-page">
    <h2>Выберите контест</h2>
    {% for contest in contests %}
    <div class="problem-item">
        <a href="{{ url_for('contest_details', contest_id=contest.id) }}">{{ contest.name }}</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
