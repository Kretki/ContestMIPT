{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="login-page">
    <h2>Регистрация в системе</h2>
    <form id="loginForm">
        <input type="text" id="nickname" name="username" placeholder="Ник" required>
        <input type="text" id="username" name="username" placeholder="Логин" required>
        <input type="password" id="password" name="password" placeholder="Пароль" required>
        <button type="button" class="btn" id="loginButton">Зарегистрироваться</button>
        <div>
            <a href="{{ url_for('login') }}">Вход</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginButton = document.getElementById('loginButton');
    loginButton.addEventListener('click', function(e) {
        e.preventDefault();

        const nickname = document.getElementById('nickname').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const data = {
            nickname: nickname,
            username: username,
            password: password
        };

        fetch('{{ url_for("registration") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            }
            else {
                throw new Error('Проблема с сетевым соединением');
            }
        })
        .then(data => {
            console.log('Success:', data);
            alert("Успешный вход");
            window.location.href = '{{ url_for("contests") }}';
        })
        .catch((error) => {
            console.error('Ошибка:', error);
            alert(error.message);
        });
    });
});
</script>
{% endblock %}
