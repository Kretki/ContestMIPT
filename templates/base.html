<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Система Контестов{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>
<body>
    <!-- Фоновый яркий градиент для всей страницы -->
    <div class="background-circles"></div>

    <!-- Контейнеры для боковых кружков -->
    <div class="side-circles left"></div>
    <div class="side-circles right"></div>

    {% block content %}{% endblock %}

    <!-- Подключаем внешний JavaScript, который генерирует кружки -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <script src="https://unpkg.com/scrollreveal"></script>
</body>
</html>
