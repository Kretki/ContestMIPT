<div class="container task-container"> 
  <!-- Editable title -->
  <h1 class="task-title" contenteditable="true" id="task-title-id">{{ problem.title }}</h1>
  
  <div class="task-description-box">
    <!-- Editable description -->
    <p class="task-description" contenteditable="true" id="task-desc-id">{{ problem.description }}</p>

    <!-- Form for answer variants -->
    <div class="task-form" id="taskForm">
      <!-- Container for dynamically managed option items -->
      <div id="optionsContainer">
  {% for option in problem.options %}
    <div class="option-wrapper" style="display: flex; align-items: center; justify-content: space-between;">
      <!-- Левая часть: сама опция -->
      <div class="option-item" style="display: flex; align-items: center; gap: 8px; flex: 1;">
        <input type="radio" name="option" value="{{ loop.index0 }}" id="option{{ loop.index0 }}"
               {% if selected is not none and selected == loop.index0 %}checked{% endif %}>

        <span class="option-label" contenteditable="true" data-index="{{ loop.index0 }}">{{ option }}</span>

        <span class="mark-correct" onclick="markCorrect(this)" style="cursor: pointer;">✔</span>

        {% if selected is not none and selected == loop.index0 %}
          {% if selected == problem.correct %}
            <span style="color: green; font-size: 20px;">✔</span>
          {% else %}
            <span style="color: red; font-size: 20px;">✘</span>
          {% endif %}
        {% endif %}
      </div>

      <!-- Правая часть: кнопка удаления -->
      <span class="delete-answer-variant" onclick="deleteOption(this)" style="cursor: pointer; font-size: 18px;">✘</span>
    </div>
  {% endfor %}
</div>
      
      <!-- Button to add a new answer variant -->
      <button type="button" class="btn" id="addOptionButton">Добавить новое поле</button>
      <!-- Final submission button -->
      <button type="submit" class="btn" id="submitButton">Подтвердить изменения</button>
    </div>
  </div>
</div>

<script>
// Keep track of the next option index (starting from the number of existing options)
let optionCount = {{ problem.options|length }};
const optionsContainer = document.getElementById('optionsContainer');

document.getElementById('addOptionButton').addEventListener('click', function () {
  const wrapper = document.createElement('div');
  wrapper.className = 'option-wrapper';
  wrapper.style.display = 'flex';
  wrapper.style.alignItems = 'center';
  wrapper.style.justifyContent = 'space-between';

  const optionDiv = document.createElement('div');
  optionDiv.className = 'option-item';
  optionDiv.style.display = 'flex';
  optionDiv.style.alignItems = 'center';
  optionDiv.style.gap = '8px';
  optionDiv.style.flex = '1';

  const input = document.createElement('input');
  input.type = 'radio';
  input.name = 'option';
  input.value = optionCount;
  input.id = 'option' + optionCount;
  optionDiv.appendChild(input);

  const span = document.createElement('span');
  span.className = 'option-label';
  span.contentEditable = 'true';
  span.textContent = 'Новый вариант';
  span.dataset.index = optionCount;
  optionDiv.appendChild(span);

  const tickBtn = document.createElement('span');
  tickBtn.className = 'mark-correct';
  tickBtn.textContent = '✔';
  tickBtn.style.cursor = 'pointer';
  tickBtn.onclick = function () {
    markCorrect(tickBtn);
  };
  optionDiv.appendChild(tickBtn);

  // Добавляем внутренний блок в обёртку
  wrapper.appendChild(optionDiv);

  // Кнопка ✘ (удалить)
  const deleteBtn = document.createElement('span');
  deleteBtn.className = 'delete-answer-variant';
  deleteBtn.textContent = '✘';
  deleteBtn.style.cursor = 'pointer';
  deleteBtn.style.fontSize = '18px';
  deleteBtn.onclick = function () {
    deleteOption(deleteBtn);
  };
  wrapper.appendChild(deleteBtn);

  // Добавляем всю конструкцию
  optionsContainer.appendChild(wrapper);
  optionCount++;
});

// Function to remove an option from the page when its delete button is clicked
function deleteOption(button) {
  const optionDiv = button.parentNode;
  optionDiv.parentNode.removeChild(optionDiv);
}

function markCorrect(btn) {
  // First, remove the current "correct" mark from any option.
  const correctItems = document.querySelectorAll('.option-item.correct');
  correctItems.forEach(function(item) {
    item.classList.remove('correct');
    // If the tick button is missing, re-add it before the delete button.
    if (!item.querySelector('.mark-correct')) {
      const tickBtn = document.createElement('span');
      tickBtn.type = 'span';
      tickBtn.className = 'mark-correct';
      tickBtn.textContent = '✔';
      tickBtn.style.cursor = 'pointer';
      tickBtn.onclick = function() { markCorrect(tickBtn); };
      // Insert the tick button before the delete button.
      const deleteBtn = item.querySelector('.delete-option');
      item.insertBefore(tickBtn, deleteBtn);
    }
    // Remove any green highlight
    item.style.backgroundColor = '';
  });

  // Mark the current option as correct.
  const optionItem = btn.parentNode;
  optionItem.classList.add('correct');
  // Change background color to a light green to indicate the selection.
  optionItem.style.backgroundColor = '#d4fcca';
  // Remove the tick button from this option.
  btn.remove();
}
// Before submitting the form, gather current texts from all option labels.
// The texts are added as hidden inputs with the name "option_texts" to be available server‑side.
document.getElementById('taskForm').addEventListener('submit', function(e) {
  // Remove any previous hidden inputs so we don't send duplicates
  const prevHiddenInputs = document.querySelectorAll('.hidden-option');
  prevHiddenInputs.forEach(function(input) {
    input.remove();
  });

  // For each option, capture its current text content
  const optionLabels = document.querySelectorAll('.option-label');
  optionLabels.forEach(function(span) {
    const hiddenInput = document.createElement('input');
    hiddenInput.type = 'hidden';
    hiddenInput.name = 'option_texts';
    hiddenInput.value = span.textContent.trim();
    hiddenInput.className = 'hidden-option';
    document.getElementById('taskForm').appendChild(hiddenInput);
  });
});

document.getElementById('submitButton').addEventListener('click', function() {
    const updatedName = document.getElementById('task-title-id').textContent;
    const updatedDescription = document.getElementById('task-desc-id').textContent;

    const container = document.getElementById('optionsContainer');
    const optionItems = container.querySelectorAll('.option-item');
    const optionLabels = container.querySelectorAll('.option-label');
    
    const options = [];
    let correctIndex = -1;
    let may = 1;
    optionItems.forEach((item, index) => {
      if (item.classList.contains('correct')) {
        correctIndex = index;
      }
    });

    optionLabels.forEach((item, index) => {
      options.push(item.textContent.trim());
    });

    if (correctIndex === -1) {
      alert('Ошибка: Не выбран правильный ответ!');
      may = 0;
    } else {
      console.log('Text contents of each option:', options);
      console.log('Index of the correct item:', correctIndex);
    }

    const data = {
        type: 'update',
        problem_type: 'question',
        name: updatedName,
        description: updatedDescription,
        items: options,
        index: correctIndex
    };

    if(may === 1)
    {
      fetch(window.location.href, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(data => {
          if (data.status =='success') {
              alert('Изменения сохранены!');
              location.reload();
          } else {
              alert('Ошибка при сохранении изменений.');
          }
      })
      .catch((error) => {
          console.error('Ошибка:', error);
          alert(error.message);
      });
    }
});
</script>
